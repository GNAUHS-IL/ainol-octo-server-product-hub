name: Bug Report
description: Report a reproducible bug or unexpected behavior in octo-server product flow
title: "[Bug] "
labels: ["type/bug", "priority/P2", "status/todo", "area/unknown"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户遇到的问题
      description: 发生了什么？用户期望是什么？请勿填写 token、cookie、私钥等敏感信息。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写清 1/2/3 步。如果无法复现，请说明触发条件。
      value: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: source_area
    attributes:
      label: 可能相关知识库领域
      placeholder: area/auth / area/bot-agent / area/im / area/unknown
    validations:
      required: false
  - type: textarea
    id: source_paths
    attributes:
      label: 涉及源码路径 / 模块
      placeholder: modules/bot_api / pkg/auth / configs/tsdd.yaml / unknown
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 代码/文档证据
      description: 格式：来源: <相对路径>#L<起>-L<止>。没有证据时写“待补查”，不要编造。
    validations:
      required: false
  - type: textarea
    id: source_context
    attributes:
      label: 来源与上下文
      description: 例如群聊反馈、人工分诊、cron 扫描；请勿写入敏感原文。
    validations:
      required: false
  - type: textarea
    id: risk_notes
    attributes:
      label: 风险说明 / 阻塞原因
      description: 如涉及凭证、权限、隐私、限流或证据冲突，只写脱敏说明。
    validations:
      required: false
