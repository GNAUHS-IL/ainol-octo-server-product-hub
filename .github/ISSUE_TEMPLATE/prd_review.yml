name: PRD Review
description: Review a PRD or request PRD changes
title: "[Review] "
labels: ["type/review", "status/prd-review"]
body:
  - type: input
    id: related_issue
    attributes:
      label: 关联 issue
      placeholder: "#12"
    validations:
      required: true
  - type: checkboxes
    id: review_focus
    attributes:
      label: Review 检查项
      options:
        - label: 用户价值是否清楚
        - label: 范围是否清楚
        - label: 验收标准是否用户可感知
        - label: 是否没有技术 How
        - label: 是否处理安全/隐私风险
        - label: 引用是否真实可核验
        - label: label 是否完整
  - type: dropdown
    id: result
    attributes:
      label: Review 结论
      options:
        - Approved
        - Changes requested
        - Rejected
        - Human needed
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 原因
    validations:
      required: false
  - type: textarea
    id: required_revision
    attributes:
      label: 必须修改项
    validations:
      required: false
