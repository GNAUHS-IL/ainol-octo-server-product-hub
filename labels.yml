# Labels for ainol-octo-server-product-hub
# V4 issue-first product backlog label system.
# Labels are applied only after an item becomes a GitHub issue.

type/bug: 需要修正的产品、行为、文档或证据错误
type/feature: 需要新增或增强的产品能力、体验、说明或材料

priority/P0: 安全、凭证、登录不可用、Bot/Agent 断联、交付核心链路阻塞
priority/P1: 核心功能异常或重要需求
priority/P2: 常规缺陷或普通增强
priority/P3: 低优先级建议、体验优化

status/inbox: 新进入，未分诊
status/triaged: 已分诊
status/needs-clarification: 信息不足，需要澄清
status/prd-drafting: PRD 草稿中
status/prd-review: 等待 Review
status/rework: Review 打回，需修改
status/accepted: 已接受处理
status/blocked: 被阻塞
status/wontfix: 决定不做
status/done: 已完成
status/duplicate: 重复
status/invalid: 无效

area/auth: 认证与身份
area/rbac: 鉴权模型 / RBAC / ACL
area/config: 配置
area/modules: 业务模块清单
area/api-error: API 与错误约定
area/im: IM 控制面
area/bot-agent: Bot 与 Agent
area/storage: 存储与外部依赖
area/build-release: 构建与发布
area/cross-module: 跨模块高频问题速查
area/docs: 文档、说明、示例、README、使用指引
area/ops: 产品运营流程、需求池、巡检与验收材料
area/unknown: 暂不能判断

pm/needs-prd: 需要补 PRD
pm/prd-ready: PRD 已准备好
pm/review-requested: 已请求 Review
pm/review-approved: Review 通过
pm/review-rejected: Review 打回
pm/human-needed: 需要人工接管

source/group: 外部沟通渠道输入
source/cron-detected: cron 扫描发现
source/manual-triage: 人工分诊
source/evaluation: 评测集输入
source/agent: Agent 生成

evidence/source-needed: 需要补源码证据
evidence/source-verified: 已完成源码核验
evidence/citation-invalid: 引用失效
evidence/not-applicable: 不适用源码证据

risk/security: 安全风险
risk/privacy: 隐私风险
risk/ambiguous: 信息模糊
risk/token-leak: 凭证泄露风险
