# Labels for ainol-octo-server-product-hub
# V5 knowledge-base-driven lightweight product backlog label system.
# Labels are applied only after an item becomes a GitHub issue.

# Type: what kind of work the issue represents. Required, exactly one.
type/bug: 修正已有能力、产品行为、文档或证据中的错误
type/feature: 新增或增强产品能力、体验、说明或材料

# Priority: handling order and urgency. Required, exactly one.
priority/P0: 安全、凭证、登录不可用、Bot/Agent 断联、交付核心链路阻塞
priority/P1: 核心功能异常或重要需求
priority/P2: 常规缺陷或普通增强
priority/P3: 低优先级建议、体验优化

# Status: current handling state. Required, exactly one.
status/todo: 已进入需求池，待处理
status/prd-drafting: PRD 草拟中
status/reviewing: Review 中
status/rework: Review 打回或内容需返工
status/accepted: 已接受处理，但尚未完成
status/blocked: 被权限、安全、证据冲突、限流或人工决策阻塞
status/done: 已完成闭环
status/wontfix: 有效但决定不处理
status/duplicate: 与已有 issue 重复
status/invalid: 无法成立为有效工作项

# Area: maps the issue to the octo-server knowledge base. At least one; use multiple for cross-area issues.
area/auth: 认证与身份
area/rbac: 鉴权模型 / RBAC / ACL
area/config: 配置
area/modules: 业务模块清单
area/api-error: API 与错误约定
area/im: IM 控制面
area/bot-agent: Bot 与 Agent
area/storage: 存储与外部依赖
area/build-release: 构建与发布
area/unknown: 暂不能判断
